<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guardian</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="logo">🛡️</div>
        <h1>Phishing Guardian</h1>
    </div>
    <div class="stats">
        <div class="stat-item">
            <div id="total-scanned">0</div>
            <label>Analysés</label>
        </div>
        <div class="stat-item safe">
            <div id="safe-emails">0</div>
            <label>Sûrs</label>
        </div>
        <div class="stat-item phishing">
            <div id="phishing-detected">0</div>
            <label>Phishing</label>
        </div>
    </div>
    <div class="history-container">
        <h3>📜 Historique Récent</h3>
        <div id="history-list">
            <p class="empty-state">Aucune analyse récente.</p>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
