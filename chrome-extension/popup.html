<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Notification Guardian</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <img src="icons/icon48.png" alt="Logo" class="logo">
        <div class="header-text">
            <h1>Notification Guardian</h1>
            <p>Interception Globale Active</p>
        </div>
    </div>
    <div class="main-content">
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="status">Statut</button>
            <button class="tab-btn" data-tab="history">Historique</button>
        </div>
        <div id="tab-status" class="tab-content active">
            <div class="status-card">
                <div class="status-indicator-on">
                    <div class="status-dot"></div>
                    <span>Intercepteur Actif</span>
                </div>
                <p class="status-description">Toutes les notifications des sites web sont analysées.</p>
            </div>
        </div>
        <div id="tab-history" class="tab-content">
            <div class="history-header">
                <h3>Notifications Récentes</h3>
                <button id="clearHistoryBtn" class="btn-clear">Effacer</button>
            </div>
            <div id="historyList" class="history-list">
                <p class="empty-state">Aucune notification enregistrée.</p>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
