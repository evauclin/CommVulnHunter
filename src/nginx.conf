server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index new_login.html;

    # Rediriger la racine vers la page de connexion
    location = / {
        return 302 http://localhost:8080/pages/new_login.html;
    }

    # Permettre l'accès libre aux pages d'authentification
    location ~* ^/pages/(new_login\.html|new_register\.html)$ {
        try_files $uri =404;
        
        # Headers de sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Page protégée (nécessite une authentification)
    location = /pages/index.html {
        try_files $uri =404;
        
        # Headers de sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
    
    # Redirection pour l'ancienne URL index.html vers la nouvelle
    location = /index.html {
        return 302 /pages/index.html;
    }

    # Servir les ressources statiques (CSS, JS, images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Fallback intelligent pour les fichiers CSV avec hash dynamique
    location ~ ^/pages/emails/([^/]+)/(.*)\.csv$ {
        root /shared/data;
        # Essayer le hash spécifique, puis fallback vers les fichiers globaux
        try_files /emails/$1/$2.csv /emails_live.csv /emails_demo.csv =404;
        
        # Headers pour CSV
        add_header Content-Type "text/csv";
        add_header Content-Disposition "inline";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Servir les fichiers CSV dans emails sans /pages avec fallback
    location ~ ^/emails/([^/]+)/(.*)\.csv$ {
        root /shared/data;
        try_files $uri /emails_live.csv /emails_demo.csv =404;
        
        # Headers pour CSV
        add_header Content-Type "text/csv";
        add_header Content-Disposition "inline";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Servir les fichiers CSV depuis la racine (plus général en dernier)
    location ~ ^/.*\.csv$ {
        root /shared/data;
        try_files $uri =404;
        
        # Headers pour CSV
        add_header Content-Type "text/csv";
        add_header Content-Disposition "inline";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Servir les autres pages et ressources
    location /pages/ {
        try_files $uri =404;
        
        # Headers de sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Servir les ressources CSS dans le dossier css/
    location /css/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Proxy vers l'API ML FastAPI
    location /api/ {
        proxy_pass http://fastapi:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers pour l'API
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # Proxy vers l'API d'authentification (accès libre)
    location /auth/ {
        proxy_pass http://auth:9000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers pour l'authentification
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Gestion des erreurs
    error_page 404 /pages/404.html;
    error_page 500 502 503 504 /pages/50x.html;
}