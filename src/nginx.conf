server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/pages;
    index login.html index.html;

    # Rediriger la racine vers la page de connexion
    location = / {
        return 302 ./login.html;
    }

    # Permettre l'accès libre aux pages d'authentification
    location ~* ^/(login\.html|register\.html)$ {
        try_files $uri =404;
        
        # Headers de sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Protection des pages sensibles - rediriger vers login
    location ~* ^/(index\.html|test-auth\.html)$ {
        # Vérifier si un cookie d'authentification existe
        set $auth_cookie $cookie_emailFilter_auth;
        
        # Si pas de cookie d'authentification, rediriger vers login
        if ($auth_cookie = "") {
            return 302 ./login.html;
        }
        
        # Servir le fichier si authentifié
        try_files $uri =404;
        
        # Headers de sécurité
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
    
    # Servir les autres pages d'authentification et ressources
    location / {
        try_files $uri $uri/ =404;
        
        # Headers de sécurité pour l'authentification
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Servir les ressources CSS
    location /css/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
        
        # Cache pour les ressources statiques
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Proxy vers l'API FastAPI pour l'authentification
    location /api/ {
        proxy_pass http://fastapi:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers pour l'API
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # Gestion des erreurs
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
