<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Filter - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #7f8c8d;
            margin: 0;
        }
        .form-floating {
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            padding: 12px 16px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            margin-bottom: 20px;
            display: none;
        }
        .form-check {
            margin-bottom: 20px;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        .forgot-password a {
            color: #667eea;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="bi bi-shield-check" style="font-size: 3rem; color: #667eea;"></i>
            <h2>Email Filter</h2>
            <p>Connexion sécurisée</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="nom@example.com" required>
                <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
                <label for="password"><i class="bi bi-key me-2"></i>Mot de passe</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                    Se souvenir de moi
                </label>
            </div>

            <button type="submit" class="btn btn-login" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </button>
        </form>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Connexion en cours...</span>
            </div>
            <p class="mt-2 text-muted">Connexion en cours...</p>
        </div>

        <div class="forgot-password">
            <a href="#" onclick="showForgotPassword()">Mot de passe oublié ?</a>
        </div>

        <div class="text-center mt-3">
            <p class="mb-0">Pas encore de compte ?</p>
            <a href="register.html" class="btn btn-outline-primary mt-2">
                <i class="bi bi-person-plus me-2"></i>Créer un compte
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth-simple.js"></script>
    <script>
        // Gestionnaire du formulaire de connexion
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            await handleLogin(email, password, rememberMe);
        });

        // Fonction de gestion de la connexion
        async function handleLogin(email, password, rememberMe) {
            const loginBtn = document.getElementById('loginBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');
            
            // Désactiver le bouton et afficher le chargement
            loginBtn.disabled = true;
            loadingSpinner.style.display = 'block';
            hideError();
            
            try {
                // Simuler un appel d'authentification
                const result = await AuthManager.login(email, password, rememberMe);
                
                if (result.success) {
                    // Rediriger vers l'application web
                    window.location.href = 'index.html';
                } else {
                    showError(result.message || 'Erreur de connexion');
                }
            } catch (error) {
                showError('Erreur de connexion. Veuillez réessayer.');
                console.error('Erreur de connexion:', error);
            } finally {
                // Réactiver le bouton
                loginBtn.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        }

        // Fonction pour afficher une erreur
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            errorText.textContent = message;
            errorMessage.style.display = 'block';
            
            // Masquer après 5 secondes
            setTimeout(() => {
                hideError();
            }, 5000);
        }

        // Fonction pour masquer l'erreur
        function hideError() {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.style.display = 'none';
        }

        // Fonction pour le mot de passe oublié
        function showForgotPassword() {
            alert('Fonctionnalité de récupération de mot de passe non implémentée pour cette démo.');
        }

        // Pas de vérification automatique sur la page de connexion
        // Permettre à l'utilisateur de se connecter même s'il y a des données de session anciennes
    </script>
</body>
</html>
