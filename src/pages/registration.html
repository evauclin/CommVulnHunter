<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-6">

<div class="bg-white rounded-3xl shadow-2xl max-w-3xl w-full flex flex-col md:flex-row overflow-hidden md:space-x-10">

  <div class="w-full md:w-1/2 h-56 md:h-auto bg-cover bg-center rounded-t-3xl md:rounded-l-3xl md:rounded-tr-none" style="background-image: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=800&q=80');"></div>

  <div class="w-full md:w-1/2 p-6 md:p-8">
    <h2 class="text-3xl font-extrabold text-gray-800 mb-6 text-center md:text-left">Create your account</h2>

    <form id="registerForm" method="POST" action="/register" onsubmit="return validateForm()" class="space-y-4">

      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input
                type="text"
                name="name"
                id="name"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-900"
                placeholder="Your full name"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
        <input
                type="email"
                name="email"
                id="email"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-900"
                placeholder="you@example.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
                type="password"
                name="password"
                id="password"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-900"
                placeholder="Minimum 8 characters"
        />
        <p class="mt-1 text-xs text-gray-500">Minimum 8 characters, at least one letter and one number.</p>
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input
                type="password"
                name="confirmPassword"
                id="confirmPassword"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-gray-900"
                placeholder="Re-enter your password"
        />
      </div>

      <p id="errorMsg" class="text-red-600 text-sm mb-2 hidden"></p>

      <button
              type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition"
      >
        Register
      </button>
    </form>

    <p class="mt-5 text-center text-gray-600 text-sm">
      Already have an account?
      <a href="login.html" class="text-blue-600 hover:underline font-medium">Log in</a>
    </p>
  </div>
</div>

<script>
  function validateForm() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;

    if (!emailRegex.test(email)) {
      errorMsg.textContent = "Please enter a valid email address.";
      errorMsg.classList.remove("hidden");
      return false;
    }

    if (!passwordRegex.test(password)) {
      errorMsg.textContent = "Password must be at least 8 characters, include a letter and a number.";
      errorMsg.classList.remove("hidden");
      return false;
    }

    if (password !== confirmPassword) {
      errorMsg.textContent = "Passwords do not match.";
      errorMsg.classList.remove("hidden");
      return false;
    }

    errorMsg.classList.add("hidden");
    return true;
  }
</script>
</body>
</html>
