<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f8;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .wrapper {
      display: flex;
      width: 880px;
      height: 560px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .left-panel {
      flex: 1;
      position: relative;
      background: url('https://images.unsplash.com/photo-1505238680356-667803448bb6?auto=format&fit=crop&w=600&q=80') center/cover no-repeat;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(34, 49, 63, 0.7);
      z-index: 0;
    }

    .left-panel > * {
      position: relative;
      z-index: 1;
    }

    .left-panel h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .left-panel p {
      font-size: 16px;
      line-height: 1.6;
      max-width: 280px;
      text-align: center;
      opacity: 0.9;
    }

    .form-panel {
      flex: 1;
      padding: 48px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-panel h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      display: block;
      font-size: 15px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.8px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 20px;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: #667eea;
      outline: none;
    }

    button {
      background: #667eea;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover:not(:disabled) {
      background: #5563c1;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      border: 2px solid #fff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      color: #d93025;
    }

    .success {
      color: #34a853;
    }

    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
        height: auto;
        width: 90%;
      }

      .left-panel {
        padding: 32px;
        height: 200px;
      }

      .form-panel {
        padding: 32px;
      }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="left-panel" aria-label="Password reset security image">
    <h2>Welcome Back</h2>
    <p>Reset your password securely and get back to your account in seconds.</p>
  </div>

  <div class="form-panel">
    <h1>Reset Password</h1>
    <form id="resetPasswordForm">
      <label for="email">Email</label>
      <input type="email" id="email" required="" placeholder="e.g. you@example.com">

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required="" minlength="8" placeholder="At least 8 chars, uppercase, digit, special">

      <button type="submit" id="submitBtn">
        <span id="btnText">Reset Password</span>
        <div class="spinner" id="spinner" style="display:none;"></div>
      </button>
    </form>
    <div class="message" id="message"></div>
  </div>
</div>




<script src="forgot-password.html.js"></script></body></html>
