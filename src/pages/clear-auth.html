<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettoyage d'Authentification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .clear-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="clear-container">
        <h2 class="mb-4">🧹 Nettoyage des Données d'Authentification</h2>
        
        <div id="status" class="mb-4">
            <p>Cliquez sur le bouton pour nettoyer toutes les données d'authentification stockées.</p>
        </div>
        
        <button class="btn btn-danger btn-lg" onclick="clearAllAuthData()">
            🗑️ Nettoyer toutes les données
        </button>
        
        <div class="mt-4">
            <a href="login.html" class="btn btn-primary">
                ↩️ Retour à la connexion
            </a>
        </div>
        
        <div class="mt-4">
            <h5>Données actuelles :</h5>
            <div id="currentData" class="text-start" style="font-family: monospace; font-size: 0.8em;">
                <!-- Les données seront affichées ici -->
            </div>
        </div>
    </div>

    <script>
        function displayCurrentData() {
            const data = {
                'emailFilter_session': localStorage.getItem('emailFilter_session'),
                'emailFilter_remember': localStorage.getItem('emailFilter_remember'),
                'cookies': document.cookie
            };
            
            let html = '';
            for (const [key, value] of Object.entries(data)) {
                const displayValue = value ? (value.length > 100 ? value.substring(0, 100) + '...' : value) : 'null';
                html += `<p><strong>${key}:</strong><br>${displayValue}</p>`;
            }
            
            document.getElementById('currentData').innerHTML = html;
        }
        
        function clearAllAuthData() {
            // Effacer localStorage
            localStorage.removeItem('emailFilter_session');
            localStorage.removeItem('emailFilter_remember');
            
            // Effacer tous les cookies d'authentification
            document.cookie = 'emailFilter_auth=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Strict';
            
            // Effacer d'autres cookies potentiels
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const eqPos = cookie.indexOf('=');
                const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                if (name.includes('emailFilter') || name.includes('auth')) {
                    document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Strict`;
                }
            }
            
            document.getElementById('status').innerHTML = `
                <div class="alert alert-success">
                    ✅ Toutes les données d'authentification ont été effacées !<br>
                    Vous pouvez maintenant vous connecter normalement.
                </div>
            `;
            
            // Actualiser l'affichage des données
            setTimeout(() => {
                displayCurrentData();
            }, 100);
        }
        
        // Afficher les données au chargement
        window.addEventListener('load', displayCurrentData);
    </script>
</body>
</html>
