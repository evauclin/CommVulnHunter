version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile_ml
    ports:
      - "8000:80"  # Changé de 80:80 à 8000:80
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      # Monter le dossier src/pages pour accéder aux CSV
      - ./src/pages:/shared/data:ro  # ro = read-only
      # Monter aussi le fichier CSV directement si nécessaire
      - ./emails_live.csv:/app/emails_live.csv:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile_web
    ports:
      - "8080:80"  # Port 8080 reste le même
    depends_on:
      - fastapi
    restart: unless-stopped
    volumes:
      - ./src/pages:/shared/data:ro
      # Permettre à nginx de servir les fichiers CSV aussi
      - ./emails_live.csv:/usr/share/nginx/html/emails_live.csv:ro