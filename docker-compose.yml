services:
  # API ML existante
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile_ml
    ports:
      - "8000:80"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Monter la structure de dossiers pour clients spécifiques
      - ./src/pages/emails:/shared/data/emails:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:80/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nouveau service d'authentification
  auth:
    build:
      context: .
      dockerfile: Dockerfile_auth
    ports:
      - "9000:9000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Monter le dossier src/pages en lecture-écriture pour créer les fichiers
      - ./src/pages:/shared/data
      - auth_data:/app/auth_system/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:9000/auth/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service web avec authentification
  web:
    build:
      context: .
      dockerfile: Dockerfile_web
    ports:
      - "8080:80"

    depends_on:
      - fastapi
      - auth
    restart: unless-stopped
    volumes:
      - ./src/pages:/shared/data:ro

volumes:
  auth_data: